<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — জননী সংসদ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="loginWrap">
  <img class="admin-deity login-deity" src="image/maa-durga.png" alt="" aria-hidden="true">
  <div class="login-box">
    <div class="emoji">🕉️</div>
    <h1>Admin Panel</h1>
    <p class="sub">জননী সংসদ — শুধুমাত্র অনুমোদিত ব্যবহারকারীদের জন্য</p>

    <div class="error-msg" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">ইমেইল</label>
        <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">পাসওয়ার্ড</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary" id="loginBtn" type="submit">লগইন করুন</button>
    </form>
    <p class="hint" style="margin-top:14px;"></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">

  <div class="sidebar">
    <div class="sidebar-brand">
      🕉️ জননী সংসদ
      <span>Admin Panel</span>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="notices"><span class="tab-icon">📢</span>নোটিশ</button>
      <button class="tab-btn" data-tab="schedule"><span class="tab-icon">🗓️</span>সময়সূচি</button>
      <button class="tab-btn" data-tab="committee"><span class="tab-icon">🧑‍🤝‍🧑</span>কার্যকরী সদস্যবৃন্দ</button>
      <button class="tab-btn" data-tab="advisors"><span class="tab-icon">🎓</span>উপদেষ্টা</button>
      <button class="tab-btn" data-tab="generalMembers"><span class="tab-icon">👥</span>সাধারণ সদস্যবৃন্দ</button>
      <button class="tab-btn" data-tab="gallery"><span class="tab-icon">🖼️</span>গ্যালারি</button>
      <button class="tab-btn" data-tab="affiliates"><span class="tab-icon">🏛️</span>অঙ্গসংগঠন</button>
      <button class="tab-btn" data-tab="ticker"><span class="tab-icon">📣</span>টিকার বার্তা</button>
      <button class="tab-btn" data-tab="settings"><span class="tab-icon">⚙️</span>সাইট সেটিংস</button>
    </nav>

    <div class="admin-search-wrap">
      <label for="adminSearch">এই তালিকায় খুঁজুন</label>
      <input id="adminSearch" type="search" placeholder="নাম বা বার্তা লিখুন">
    </div>

    <div class="sidebar-foot">
      <span class="user-email" id="userEmail"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">লগ-আউট</button>
    </div>
  </div>

  <div class="main">
    <img class="admin-deity dashboard-deity" src="image/maa-durga.png" alt="" aria-hidden="true">

    <!-- ---------- NOTICES ---------- -->
    <div class="panel active" id="panel-notices">
      <div class="panel-head">
        <h2>নোটিশ</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('notices')">+ নতুন নোটিশ</button>
      </div>
      <div id="list-notices"></div>
    </div>

    <!-- ---------- SCHEDULE ---------- -->
    <div class="panel" id="panel-schedule">
      <div class="panel-head">
        <h2>সময়সূচি</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('schedule')">+ নতুন দিন যোগ করুন</button>
      </div>
      <div id="list-schedule"></div>
    </div>

    <!-- ---------- কার্যকরী সদস্যবৃন্দ ---------- -->
    <div class="panel" id="panel-committee">
      <div class="panel-head">
        <h2>কার্যকরী সদস্যবৃন্দ</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('committee')">+ নতুন সদস্য</button>
      </div>
      <div id="list-committee"></div>
    </div>

    <!-- ---------- উপদেষ্টা ---------- -->
    <div class="panel" id="panel-advisors">
      <div class="panel-head">
        <h2>উপদেষ্টা</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('advisors')">+ নতুন উপদেষ্টা</button>
      </div>
      <div id="list-advisors"></div>
    </div>

    <!-- ---------- সাধারণ সদস্যবৃন্দ ---------- -->
    <div class="panel" id="panel-generalMembers">
      <div class="panel-head">
        <h2>সাধারণ সদস্যবৃন্দ</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('generalMembers')">+ নতুন সদস্য</button>
      </div>
      <div id="list-generalMembers"></div>
    </div>

    <!-- ---------- GALLERY ---------- -->
    <div class="panel" id="panel-gallery">
      <div class="panel-head">
        <h2>গ্যালারি</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('gallery')">+ নতুন ছবি</button>
      </div>
      <div id="list-gallery"></div>
    </div>

    <!-- ---------- AFFILIATES ---------- -->
    <div class="panel" id="panel-affiliates">
      <div class="panel-head">
        <h2>অঙ্গসংগঠন</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('affiliates')">+ নতুন সংগঠন</button>
      </div>
      <div id="list-affiliates"></div>
    </div>

    <!-- ---------- TICKER ---------- -->
    <div class="panel" id="panel-ticker">
      <div class="panel-head">
        <h2>টিকার বার্তা</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('ticker')">+ নতুন বার্তা</button>
      </div>
      <div id="list-ticker"></div>
    </div>

    <!-- ---------- SITE SETTINGS ---------- -->
    <div class="panel" id="panel-settings">
      <div class="panel-head">
        <h2>সাইট সেটিংস</h2>
        <button class="btn btn-gold btn-sm" onclick="openForm('settings')">সেটিংস এডিট করুন</button>
      </div>
      <div id="list-settings"></div>
    </div>

  </div>

</div>

<!-- ===================== FORM MODAL ===================== -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">যোগ করুন</h3>
    <div class="error-msg" id="formError"></div>
    <form id="itemForm"></form>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
