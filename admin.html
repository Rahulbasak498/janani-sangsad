<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — জননী সংসদ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="emoji">🕉️</div>
    <h1>Admin Panel</h1>
    <p class="sub">জননী সংসদ — শুধুমাত্র অনুমোদিত ব্যবহারকারীদের জন্য</p>

    <div class="error-msg" id="loginError"></div>

    <div class="field">
      <label>ইমেইল</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" id="loginBtn">লগইন করুন</button>
    <p class="hint" style="margin-top:14px;">অ্যাকাউন্ট তৈরির জন্য SETUP-GUIDE.md দেখুন।</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">

  <div class="topbar">
    <div class="brand">🕉️ জননী সংসদ — Admin</div>
    <div>
      <span class="user-email" id="userEmail"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn" style="border-color:var(--gold-light);color:var(--gold-light);">লগ-আউট</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="notices">নোটিশ</button>
    <button class="tab-btn" data-tab="schedule">সময়সূচি</button>
    <button class="tab-btn" data-tab="committee">কার্যকরী সদস্যবৃন্দ</button>
    <button class="tab-btn" data-tab="advisors">উপদেষ্টা</button>
    <button class="tab-btn" data-tab="generalMembers">সাধারণ সদস্যবৃন্দ</button>
    <button class="tab-btn" data-tab="gallery">গ্যালারি</button>
    <button class="tab-btn" data-tab="affiliates">অঙ্গসংগঠন</button>
  </div>

  <!-- ---------- NOTICES ---------- -->
  <div class="panel active" id="panel-notices">
    <div class="panel-head">
      <h2>নোটিশ</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('notices')">+ নতুন নোটিশ</button>
    </div>
    <div id="list-notices"></div>
  </div>

  <!-- ---------- SCHEDULE ---------- -->
  <div class="panel" id="panel-schedule">
    <div class="panel-head">
      <h2>সময়সূচি</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('schedule')">+ নতুন দিন যোগ করুন</button>
    </div>
    <div id="list-schedule"></div>
  </div>

  <!-- ---------- কার্যকরী সদস্যবৃন্দ ---------- -->
  <div class="panel" id="panel-committee">
    <div class="panel-head">
      <h2>কার্যকরী সদস্যবৃন্দ</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('committee')">+ নতুন সদস্য</button>
    </div>
    <div id="list-committee"></div>
  </div>

  <!-- ---------- উপদেষ্টা ---------- -->
  <div class="panel" id="panel-advisors">
    <div class="panel-head">
      <h2>উপদেষ্টা</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('advisors')">+ নতুন উপদেষ্টা</button>
    </div>
    <div id="list-advisors"></div>
  </div>

  <!-- ---------- সাধারণ সদস্যবৃন্দ ---------- -->
  <div class="panel" id="panel-generalMembers">
    <div class="panel-head">
      <h2>সাধারণ সদস্যবৃন্দ</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('generalMembers')">+ নতুন সদস্য</button>
    </div>
    <div id="list-generalMembers"></div>
  </div>

  <!-- ---------- GALLERY ---------- -->
  <div class="panel" id="panel-gallery">
    <div class="panel-head">
      <h2>গ্যালারি</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('gallery')">+ নতুন ছবি</button>
    </div>
    <div id="list-gallery"></div>
  </div>

  <!-- ---------- AFFILIATES ---------- -->
  <div class="panel" id="panel-affiliates">
    <div class="panel-head">
      <h2>অঙ্গসংগঠন</h2>
      <button class="btn btn-gold btn-sm" onclick="openForm('affiliates')">+ নতুন সংগঠন</button>
    </div>
    <div id="list-affiliates"></div>
  </div>

</div>

<!-- ===================== FORM MODAL ===================== -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">যোগ করুন</h3>
    <div class="error-msg" id="formError"></div>
    <form id="itemForm"></form>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
